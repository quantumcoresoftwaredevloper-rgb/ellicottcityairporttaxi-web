name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The static gates: colours, catalog drift, lint, types.
  # These are the ones that caught real production bugs, and they need no
  # database, so they run first and fail fast.
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - name: contrast gate
        run: npm run check:contrast
        working-directory: client
      - name: catalog fallback matches the server
        run: npm run check:catalog
        working-directory: client
      - name: lint
        run: npm run lint
        working-directory: client
      - name: build
        run: npm run build
        working-directory: client
      - name: critical-path bundle gate
        # Must run against the BUILT artefact. The e2e suite drives the Vite dev
        # server, which emits neither manualChunks nor modulepreload, so it
        # cannot see this regression — a guard written there passed with the bug
        # deliberately reintroduced.
        run: npm run check:bundle
        working-directory: client
      - name: lint (server)
        run: npm run lint
        working-directory: server

  # API integration tests against a real in-memory MongoDB. No service
  # container needed — mongodb-memory-server boots its own mongod.
  server-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: vitest
        run: npm test
        working-directory: server

  client-tests:
    name: Client unit tests
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client

  # The web <-> API seam. Starts the real API (local mongod via service
  # container) and the real dev server, then drives the browser.
  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7
      - name: Seed
        run: npm run seed
        working-directory: server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ellicottaxi_test
          JWT_ACCESS_SECRET: ci-secret-that-is-at-least-32-characters-long
      - name: Start API
        run: npm start &
        working-directory: server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ellicottaxi_test
          JWT_ACCESS_SECRET: ci-secret-that-is-at-least-32-characters-long
          CLIENT_ORIGIN: http://localhost:5173
          # NOT production: assertEnv() refuses a localhost MONGO_URI in production,
          # and CI runs a local mongod. These tests check the API seam. The
          # production boot guard is covered by tests/env.test.js instead.
          NODE_ENV: development
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/health > /dev/null; then echo "api up"; exit 0; fi
            sleep 2
          done
          echo "api never came up"; exit 1
      - name: Browser smoke tests
        run: npm run test:e2e
        working-directory: client
        env:
          VITE_API_URL: ''
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  deploy-frontend:
    name: Deploy frontend to VPS
    runs-on: self-hosted
    needs: gates
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: client
      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: https://api.ellicottcityairporttaxi.com
        run: npm run build
      - name: Deploy frontend
        run: |
          sudo rsync -az --delete \
            --exclude '.well-known' \
            --exclude 'googlebffcbf76070b0706.html' \
            client/dist/ \
            /var/www/ellicottcityairporttaxi.com/

  # Second public domain for the same app: columbiaairporttransportation.com.
  #
  # It was previously a hand-uploaded copy of the build that drifted — it kept
  # serving an old bundle while the Ellicott site moved on, and nothing would
  # ever have updated it again. This job makes that impossible.
  #
  # SAME-ORIGIN, unlike deploy-frontend. That is deliberate: this build has no
  # VITE_API_URL, so the client calls /api on whatever host it was loaded from and
  # nginx proxies it to :5001. Nothing cross-origin is involved, so no CORS
  # change is needed for this domain. Do not add VITE_API_URL here — baking the
  # API host in would make every user of this domain depend on the API's CORS
  # allowlist naming it, and that failure is invisible until someone clicks
  # "Sign in".
  deploy-frontend-alt:
    name: Deploy frontend to Columbia domain
    runs-on: self-hosted
    needs: gates
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: client
      - name: Build frontend (same-origin)
        working-directory: client
        # Explicitly empty rather than unset, so a stray repository or runner
        # variable cannot silently flip this build back to cross-origin.
        env:
          VITE_API_URL: ''
        run: npm run build
      - name: Deploy frontend
        run: |
          sudo mkdir -p /var/www/columbiaairporttransportation.com
          sudo rsync -az --delete \
            --exclude '.well-known' \
            --exclude 'googlebffcbf76070b0706.html' \
            client/dist/ \
            /var/www/columbiaairporttransportation.com/
          # Fail the job loudly rather than leaving a half-updated document root
          # that nginx would keep serving. `index.html` is the SPA entrypoint;
          # if it is missing, the site is a blank page.
          sudo test -f /var/www/columbiaairporttransportation.com/index.html \
            || { echo "::error::index.html missing after deploy — site is broken"; exit 1; }

  deploy-backend:
    name: Deploy backend to VPS
    runs-on: self-hosted
    needs: server-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: server
      - name: Deploy backend
        run: |
          sudo rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'ecosystem.config.*' \
            server/ \
            /home/deploy/api/
          # Delete-then-start rather than restart. `pm2 restart` replays the
          # script path recorded when the process was first created, so if that
          # file has been renamed or removed the restart cannot recover — it
          # fails and leaves the API down (502 behind nginx). Starting fresh
          # every deploy means the recorded path always matches what is on disk.
          sudo bash -c 'cd /home/deploy/api \
            && chmod +x scripts/start.sh \
            && npm ci --omit=dev \
            && pm2 delete ellicott-api >/dev/null 2>&1 || true; \
            cd /home/deploy/api \
            && pm2 start scripts/start.sh --name ellicott-api \
            && pm2 save'
